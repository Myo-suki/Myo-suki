<text x="600" y="382" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="8" fill="#d7a6b3">MYO</text>
<rect x=".75" y=".75" width="1198.5" height="408.5" rx="17.25" fill="none" stroke="#c5a45d" stroke-opacity=".38" stroke-width="1.5"/>
</svg>