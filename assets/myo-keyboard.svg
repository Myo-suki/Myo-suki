<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410">
<defs>
 <linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#d9dcdf"/></linearGradient>
 <linearGradient id="key" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".7" stop-color="#eceff1"/><stop offset="1" stop-color="#cfd3d6"/></linearGradient>
 <radialGradient id="ice"><stop stop-color="#dff8ff" stop-opacity=".95"/><stop offset=".45" stop-color="#83dcf2" stop-opacity=".35"/><stop offset="1" stop-color="#83dcf2" stop-opacity="0"/></radialGradient>
 <radialGradient id="pink"><stop stop-color="#f8e5ea" stop-opacity=".95"/><stop offset=".45" stop-color="#d7a6b3" stop-opacity=".4"/><stop offset="1" stop-color="#d7a6b3" stop-opacity="0"/></radialGradient>
 <radialGradient id="gold"><stop stop-color="#fff6c9"/><stop offset=".25" stop-color="#f4d77d"/><stop offset=".65" stop-color="#c5a45d"/><stop offset="1" stop-color="#7f642e"/></radialGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".55"/></filter>
 <filter id="goldGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#f5d776" flood-opacity=".9"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="16"/></filter>
 <pattern id="bggrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern>
</defs>
<style>
 .waveIce{animation:iceMove 6s ease-in-out infinite}.wavePink{animation:pinkMove 6s ease-in-out infinite}
 .myo{animation:myoGlow 6s ease-in-out infinite}.label{animation:labelGlow 6s ease-in-out infinite}
 @keyframes iceMove{0%,100%{transform:translateX(-280px);opacity:.25}35%{transform:translateX(280px);opacity:.9}60%{opacity:.3}}
 @keyframes pinkMove{0%,20%{transform:translateX(330px);opacity:.15}55%{transform:translateX(-230px);opacity:.9}80%,100%{opacity:.25}}
 @keyframes myoGlow{0%,45%{opacity:.45;filter:none}58%,82%{opacity:1;filter:url(#goldGlow)}100%{opacity:.55;filter:none}}
 @keyframes labelGlow{0%,45%{fill:#7b7d80}58%,82%{fill:#fff4bb}100%{fill:#7b7d80}}
</style>
<rect width="1200" height="410" rx="18" fill="#090909"/><rect width="1200" height="410" rx="18" fill="url(#bggrid)"/>
<text x="55" y="54" font-family="monospace" font-size="12" letter-spacing="3" fill="#c5a45d">MYO / RGB SIGNATURE</text>
<text x="1145" y="54" text-anchor="end" font-family="monospace" font-size="10" fill="#777">ICE BLUE · POWDER PINK · GOLD</text>
<g filter="url(#shadow)">
 <rect x="55" y="82" width="1090" height="260" rx="25" fill="url(#case)" stroke="#fff" stroke-width="3"/>
 <rect x="73" y="100" width="1054" height="224" rx="16" fill="#16181a"/>
</g>
<g class="waveIce" filter="url(#softGlow)"><ellipse cx="390" cy="213" rx="280" ry="125" fill="url(#ice)"/></g>
<g class="wavePink" filter="url(#softGlow)"><ellipse cx="810" cy="213" rx="280" ry="125" fill="url(#pink)"/></g>
<g id="keys" fill="url(#key)" stroke="#aeb4b8" stroke-width="1.2">
